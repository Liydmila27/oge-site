<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Теория — Тренажёр ОГЭ по математике</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="decor">
    <img class="d1 big"   src="art/3.png" alt="">
    <img class="d2 big"   src="art/4.png" alt="">
    <img class="d3 big"   src="art/5.png" alt="">
    <img class="d4 small" src="art/3.png" alt="">
    <img class="d5 small" src="art/4.png" alt="">
    <img class="d6 small" src="art/5.png" alt="">
  </div>

  <header>
    <span>Теория и примеры</span>
    <nav>
      <a href="main.html">Главная</a>
      <a href="theory.html">Теория</a>
      <a href="variant.html">Вариант</a>
      <a href="checklist.html">Чек-лист</a>
      <a href="about.html">Обо мне</a>
      <button id="auth-btn">Войти</button>
    </nav>
  </header>

  <main class="theory-topic-main">
    <h2 id="slides-title" class="topic-title"></h2>

    <div id="slides" class="slides-box"></div>

    <button onclick="location.href='subtheory.html?topic=10'">Назад к выбору раздела</button>
  </main>

  <footer class="site-footer">
    <img src="art/6.png" alt="Фото создателя">
    <span>Создатель: Чертолыс Людмила Александровна</span>
  </footer>

  <script src="access.js"></script>
  <script>
    // Справочник подтем: где лежат слайды и сколько их
    const SLIDES = {
      "10_1": { title: "Классическая теория вероятности", dir: "12/11", from: 1, to: 26 },
      "10_2": { title: "Круги Эйлера",                   dir: "12/12", from: 1, to: 0 },  // заполнишь позже
      "10_3": { title: "Дерево случайных событий",        dir: "12/13", from: 1, to: 0 }   // заполнишь позже
    };

    const topic = new URLSearchParams(location.search).get("topic") || "10_1";
    const data = SLIDES[topic];

    const box = document.getElementById("slides");
    if (!data || data.to < data.from) {
      document.getElementById("slides-title").textContent =
        data ? data.title : "Раздел в разработке";
      box.innerHTML = "<p class='theory-hint'>Материалы скоро появятся.</p>";
    } else {
      document.getElementById("slides-title").textContent = data.title;
      for (let i = data.from; i <= data.to; i++) {
        const img = document.createElement("img");
        img.src = data.dir + "/Слайд" + i + ".png";
        img.alt = "Слайд " + i;
        img.className = "slide-img";
        box.appendChild(img);
      }
    }
  </script>

</body>
</html>
